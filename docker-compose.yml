# One application container and its database. No queue and no model server:
# Ollama stays on the host, and everything else this application needs still
# runs in-process.
#
# The database is where the knowledge bases, the ingest ledger, the content
# identities and their analysis state, the ingest journal, the gold set and --
# since Step 9 -- the chunks and their embeddings live. It runs the pgvector
# image because of that last pair: `alembic upgrade head` creates the `vector`
# extension, and a stock postgres image cannot. The parser cache, the packaged
# Viewer artifacts and the logs are still files under the mounted directory.
#
# The schema is created by a migration, not by the application: run
#
#     docker compose run --rm app alembic upgrade head
#
# once after `up -d`, and after every upgrade that ships one. Nothing in the
# application creates a table at start-up, which is what makes that step
# reviewable rather than a side effect of a deploy.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat-rag-db
    environment:
      POSTGRES_USER: chat_rag
      POSTGRES_DB: chat_rag
      # Replace this. It is a tracked file, so the value here is a placeholder
      # for a local run: set POSTGRES_PASSWORD in the shell (or in a .env
      # beside this file, which compose reads and git ignores) and set the
      # matching DATABASE_URL in .env.docker.local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_rag}
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_rag -d chat_rag"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # Stamps the commit into the image so `cli report` can name it.
        # Optional: unset, the manifest honestly reports it as unknown.
        CHAT_RAG_GIT_SHA: ${CHAT_RAG_GIT_SHA:-}
    image: chat-rag:local
    container_name: chat-rag
    ports:
      - "5005:5005"

    env_file:
      # Tracked defaults, then optional private overrides. Later files win, so
      # .env.docker.local can replace anything above without being tracked.
      - path: .env.docker
        required: true
      - path: .env.docker.local
        required: false

    environment:
      # Structural, not configuration: this says where the container's *files*
      # live, and must match the mount below. It is the only path this
      # deployment sets -- the parser's canonical-unit cache, the packaged
      # Viewer artifacts, the embedding caches, the uploads and the logs are
      # all derived from it, and a .env left over from local development can
      # no longer override any of them. The records and the vectors are not
      # files at all; DATABASE_URL says where they are.
      CHAT_RAG_DATA_DIR: /data

    volumes:
      # Every *file* the application persists -- the parser's canonical-unit
      # cache, the packaged Viewer artifacts, the embedding caches, the
      # uploads and the logs -- lives under one directory, so a rebuilt
      # container finds them where it left them. The records and the vectors
      # are in the database volume above.
      #
      # This is a fresh directory, separate from the checkout's own .cache/
      # and artifacts/viewer-live/: running the container never touches local
      # development state.
      - ./.docker-data:/data
      # Evaluation output written by `python -m cli`. Mounted per
      # subdirectory so artifacts/gold/ keeps coming from the image, where
      # frozen gold sets are read-only inputs rather than runtime state.
      - ./.docker-data/artifacts/runs:/app/artifacts/runs
      - ./.docker-data/artifacts/reports:/app/artifacts/reports

    depends_on:
      db:
        # Not merely started: the application refuses to serve without a
        # reachable database, so starting it against a server still replaying
        # its write-ahead log would be a container that exits and restarts
        # until the database happens to be up.
        condition: service_healthy

    extra_hosts:
      # Docker Desktop provides this name already; declaring it means the same
      # OLLAMA_BASE_URL also works on plain Linux Docker.
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5005/api/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      # Building the pipeline and reading an existing store takes a moment on
      # first boot; the container is not called unhealthy while that happens.
      start_period: 60s
      retries: 3

    # The default SIGTERM is enough now: wsgi.py turns it into the SystemExit
    # waitress already drains its request threads on, so `docker compose down`
    # exits 0 instead of being killed at the end of the grace period. (The
    # SIGINT override this used to need was a workaround for Werkzeug's
    # development server, which ignored SIGTERM.)
    stop_grace_period: 15s

    restart: unless-stopped
