# Alembic, the only thing that creates a table in this application.
#
# There is deliberately no `metadata.create_all()` anywhere in the source: a
# schema that appears as a side effect of importing the application is a schema
# nobody can reproduce, roll back or review. A fresh database is built by
#
#     alembic upgrade head
#
# and by nothing else -- the test fixtures included, so what the suite runs
# against is what a deployment runs against.
#
# The connection string is NOT written here. It comes from DATABASE_URL through
# chat_rag/config/database.py
# (src/chat_rag/storage/migrations/env.py reads it), so the migrations
# and the application can never be pointed at two different databases, and no
# credential is ever in a tracked file.

[alembic]
script_location = src/chat_rag/storage/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
